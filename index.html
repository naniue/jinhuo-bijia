<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>进货比价 · 商品一覧</title>
  <link rel="stylesheet" href="styles.css?v=compact2" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="./">进货比价</a>
      <p class="channels-label">AmiAmi · Sootang · AniSmile · 线下</p>
      <label class="rate-field">
        1円 =
        <input id="rate" type="number" inputmode="decimal" min="0.0001" step="0.0001" />
        元
      </label>
      <button type="button" class="header-btn" id="add-product">添加</button>
    </div>
  </header>

  <main class="catalog">
    <h1>商品一覧</h1>

    <div class="result-bar">
      <p id="result-label">「全部」の検索結果(0件)</p>
      <div class="result-tools">
        <input id="search" type="search" placeholder="搜索商品名 / 动漫 / 种类" />
        <select id="sort">
          <option value="recommend">おすすめ順</option>
          <option value="category">按分类</option>
          <option value="sale">发售日期</option>
          <option value="reprints">再贩次数</option>
          <option value="newest">最近添加</option>
          <option value="name">商品名</option>
        </select>
      </div>
    </div>

    <details class="calc-panel">
      <summary>快速试算 · 按不含运费比价，630円按整单算</summary>
      <div class="calc-grid" id="calc-grid"></div>
      <div class="calc-foot">
        <p id="calc-hint">至少填写一个渠道价格后，会立刻换算人民币并标出推荐。</p>
        <button type="button" class="header-btn" id="save-calc">存入商品库</button>
      </div>
    </details>

    <div class="filter-panel">
      <div class="filter-row">
        <span>动漫</span>
        <div class="chip-row" id="anime-filters"></div>
      </div>
      <div class="filter-row">
        <span>种类</span>
        <div class="chip-row" id="kind-filters"></div>
      </div>
    </div>
    <div class="item-grid" id="product-list"></div>
  </main>

  <dialog class="modal" id="product-modal">
    <form id="product-form" method="dialog">
      <header>
        <h3 id="modal-title">添加商品</h3>
        <button type="button" class="icon-btn" id="close-modal" aria-label="关闭">×</button>
      </header>
      <div class="form-body">
        <label class="full">
          商品名称
          <input name="name" required maxlength="80" placeholder="例如：るかっぷ 伏黒恵" />
        </label>
        <label>
          动漫
          <input name="anime" list="anime-list" maxlength="40" placeholder="例如：咒术廻戦" />
        </label>
        <label>
          商品种类
          <input name="kind" list="kind-list" maxlength="40" placeholder="例如：手办 / 吧唧 / 坐垫" />
        </label>
        <label>
          AmiAmi（日元）
          <input name="amiami" type="number" min="0" step="1" placeholder="不含运费" />
        </label>
        <label>
          Sootang（日元）
          <input name="sootang" type="number" min="0" step="1" placeholder="日元标价" />
        </label>
        <label>
          AniSmile（日元）
          <input name="anismile" type="number" min="0" step="1" placeholder="不含运费" />
        </label>
        <label>
          线下（日元）
          <input name="offline" type="number" min="0" step="1" placeholder="日元标价" />
        </label>
        <div class="full sale-field">
          <span>发售日期</span>
          <p class="field-hint">同一商品多次贩卖就各加一行，会显示成 2024年03月 / 2025年07月。</p>
          <div id="sale-dates"></div>
          <button type="button" class="text-btn" id="add-sale-date">添加一次贩卖</button>
        </div>
        <label class="full">
          其他备注
          <input name="note" maxlength="120" placeholder="规格、店铺等，日期请写在上面" />
        </label>
        <div class="full photo-field">
          <span>商品照片</span>
          <div class="photo-picker" id="photo-picker">
            <img id="photo-preview" alt="商品预览" hidden />
            <p class="photo-empty" id="photo-empty">点击上传、拖入，或 Ctrl+V 粘贴图片</p>
            <input id="photo-input" type="file" accept="image/*" />
          </div>
          <button type="button" class="text-btn" id="remove-photo" hidden>移除照片</button>
        </div>
      </div>
      <footer>
        <p class="form-tip">价格按不含运费比价。AmiAmi / AniSmile 的 630 円是整单运费，凑单时不计入单件。图片可直接复制粘贴。</p>
        <div class="form-actions">
          <button type="button" class="ghost-btn" id="cancel-modal">取消</button>
          <button type="submit" class="header-btn">保存</button>
        </div>
      </footer>
    </form>
  </dialog>

  <dialog class="lightbox" id="lightbox" aria-label="查看商品照片">
    <img id="lightbox-image" alt="商品照片" />
  </dialog>

  <dialog class="modal" id="detail-modal">
    <article class="detail-card">
      <header>
        <h3 id="detail-title">商品详情</h3>
        <button type="button" class="icon-btn" id="close-detail" aria-label="关闭">×</button>
      </header>
      <div class="detail-body">
        <button type="button" class="detail-photo" id="detail-photo-btn">
          <img id="detail-photo" alt="" hidden />
          <span class="item-photo-empty" id="detail-photo-empty">NO IMAGE</span>
        </button>
        <p class="item-cats" id="detail-cats"></p>
        <p class="item-sales" id="detail-sales"></p>
        <p class="item-note" id="detail-interval"></p>
        <p class="item-note" id="detail-note"></p>
        <p class="item-price"><span class="off">不含运费</span></p>
        <ul class="item-channels" id="detail-channels"></ul>
      </div>
      <footer>
        <div class="form-actions">
          <button type="button" class="text-btn" id="detail-delete">删除</button>
          <button type="button" class="header-btn" id="detail-edit">编辑</button>
        </div>
      </footer>
    </article>
  </dialog>

  <datalist id="anime-list"></datalist>
  <datalist id="kind-list"></datalist>

  <p class="boot-error" id="boot-error" hidden>页面加载失败，请刷新重试。</p>
  <p class="toast" id="toast" hidden></p>
  <script src="app.js?v=compact2"></script>
</body>
</html>
